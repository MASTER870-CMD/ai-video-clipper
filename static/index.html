<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Video Clipper – Long-Form to Viral Shorts</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-border: #1e293b;
      --ink: #f1f5f9;
      --mute: #94a3b8;
      --red: #ef4444;
      --red-hover: #dc2626;
      --red-glow: rgba(239, 68, 68, 0.25);
      --line: #2d3748;
      --radius: 10px;
    }
    @media(prefers-color-scheme:light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --ink: #0f172a;
        --mute: #64748b;
        --red: #e11d48;
        --red-hover: #be123c;
        --line: #cbd5e1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      background: var(--red-glow);
      color: var(--red);
      border: 1px solid var(--red);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
    }
    p.sub {
      color: var(--mute);
      margin: 0 0 32px;
      max-width: 60ch;
      font-size: 1.1rem;
    }
    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--card);
      padding: 8px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    input {
      flex: 1 1 340px;
      padding: 14px 18px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--red);
    }
    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) {
      background: var(--red-hover);
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 32px;
      display: none;
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
    }
    .bar {
      height: 10px;
      background: var(--line);
      border-radius: 5px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--red);
      transition: width 0.4s ease;
    }
    #stage {
      margin: 12px 0 0;
      color: var(--mute);
      font-size: 0.95rem;
      font-weight: 500;
    }
    #tl {
      display: none;
      margin: 36px 0 12px;
    }
    #tl h2, #clips h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .track {
      position: relative;
      height: 48px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .seg {
      position: absolute;
      top: 4px;
      bottom: 4px;
      background: var(--red);
      border-radius: 6px;
      min-width: 8px;
      color: #fff;
      font: 700 0.8rem/40px system-ui;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--red-glow);
    }
    .ends {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 0.85rem;
      margin-top: 6px;
      font-family: monospace;
    }
    #clips {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .clip {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .clip:hover {
      transform: translateY(-2px);
    }
    .thumb {
      aspect-ratio: 9/16;
      background: #000;
      display: grid;
      place-items: center;
      color: var(--mute);
      font-size: 0.9rem;
      position: relative;
    }
    .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .time {
      font: 700 0.95rem monospace;
      color: var(--red);
    }
    .info b {
      font-size: 1rem;
      line-height: 1.3;
    }
    .info small {
      color: var(--mute);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }
    .row a, .row button {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
    }
    .row a {
      background: var(--red);
      color: #fff;
      border: 0;
    }
    .row button {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--mute);
    }
    #err {
      color: var(--red);
      margin-top: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Next-Gen AI Pipeline</div>
    <h1>Paste a video. Get viral Shorts.</h1>
    <p class="sub">Autonomous multimodal pipeline that extracts high-retention hooks, reframes to 9:16 portrait, and synthesizes kinetic karaoke subtitles.</p>
    
    <form id="f">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required aria-label="YouTube video URL">
      <button id="go" type="submit">Create Clips</button>
    </form>
    
    <div id="err" role="alert"></div>
    
    <section id="status">
      <div class="bar"><i id="pb"></i></div>
      <p id="stage">Initializing engine...</p>
    </section>
    
    <section id="tl">
      <h2>Clip Origin Timeline</h2>
      <div class="track" id="track"></div>
      <div class="ends"><span>0:00</span><span id="total"></span></div>
    </section>
    
    <section id="clips" aria-live="polite"></section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const mmss = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");

    $("f").onsubmit = async (e) => {
      e.preventDefault();
      $("err").textContent = "";
      $("go").disabled = true;
      $("clips").innerHTML = "";
      $("tl").style.display = "none";

      try {
        const r = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: $("url").value.trim() })
        });
        if (!r.ok) {
          const errData = await r.json();
          $("err").textContent = errData.detail || "Failed to process video.";
          $("go").disabled = false;
          return;
        }
        const data = await r.json();
        $("status").style.display = "block";
        poll(data.id);
      } catch (err) {
        $("err").textContent = "Network error: " + err.message;
        $("go").disabled = false;
      }
    };

    async function poll(id) {
      try {
        const res = await fetch("/api/jobs/" + id);
        if (!res.ok) throw new Error("Could not fetch job status");
        const j = await res.json();
        
        $("pb").style.width = j.progress + "%";
        $("stage").textContent = j.status === "error" ? "" : `${j.stage} (${j.progress}%)`;
        
        if (j.clips && j.clips.length) {
          show(j);
        }
        
        if (j.status === "error") {
          $("err").textContent = "Error: " + j.error;
          $("go").disabled = false;
          return;
        }
        if (j.status === "done") {
          $("go").disabled = false;
          return;
        }
        setTimeout(() => poll(id), 2000);
      } catch (err) {
        $("err").textContent = "Polling error: " + err.message;
        $("go").disabled = false;
      }
    }

    function show(j) {
      $("tl").style.display = "block";
      $("total").textContent = mmss(j.duration);
      $("track").innerHTML = j.clips.map(c =>
        `<div class="seg" style="left:${(c.start / j.duration) * 100}%;width:${((c.end - c.start) / j.duration) * 100}%">${c.id}</div>`
      ).join("");
      
      $("clips").innerHTML = j.clips.map(c => `
        <article class="clip">
          <div class="thumb">
            ${c.file ? `<video src="${c.file}" controls playsinline preload="metadata"></video>` : `<span>Rendering clip ${c.id}...</span>`}
          </div>
          <div class="info">
            <div class="time">${mmss(c.start)} – ${mmss(c.end)}</div>
            <b>${c.title}</b>
            <small>Score: ${c.score}/100 · ${c.reason}</small>
            <div class="row">
              ${c.file ? `<a href="${c.file}" download="clip_${c.id}.mp4">Download</a>` : ""}
              <button disabled title="OAuth auto-publish available in prototype branch">Post to Shorts</button>
            </div>
          </div>
        </article>
      `).join("");
    }
  </script>
</body>
</html>
